name: Submit to Web Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Build and publish extension
    runs-on: ubuntu-latest
    env:
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_BASE_URL: https://photosweep-license-api-206538169327.us-west1.run.app
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_HOST_PERMISSION: https://photosweep-license-api-206538169327.us-west1.run.app/*
      PLASMO_PUBLIC_PHOTOSWEEP_ALLOW_DEV_ENTITLEMENT: "0"
      PLASMO_PUBLIC_PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY: ${{ secrets.PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GPTK dependencies
        run: npm ci
        working-directory: Google-Photos-Toolkit

      - name: Typecheck
        run: npm run typecheck

      - name: Run release tests
        run: npm test

      - name: Build and package extension
        run: npm run package

      - name: Audit extension package
        run: npm run audit:extension-package

      - name: Publish to Chrome Web Store
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip

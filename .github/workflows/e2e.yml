name: Full E2E

# Full E2E tests connect to a running Chrome instance via CDP and require
# the user to be logged into Google Photos in that browser. They cannot run
# in a standard CI environment without additional infrastructure (e.g. a
# persistent Chrome service with an active session).
#
# Run manually from the Actions tab, or locally with: npm run test:e2e
# (Chrome must be running with --remote-debugging-port=9222)

on:
  workflow_dispatch:
    inputs:
      cdp_url:
        description: "Chrome CDP URL (default: http://localhost:9222)"
        required: false
        default: "http://localhost:9222"

permissions:
  contents: read

jobs:
  e2e:
    name: Full E2E (requires live Chrome + GP session)
    runs-on: ubuntu-latest
    env:
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_BASE_URL: https://photosweep-license-api-206538169327.us-west1.run.app
      PLASMO_PUBLIC_PHOTOSWEEP_LICENSE_API_HOST_PERMISSION: https://photosweep-license-api-206538169327.us-west1.run.app/*
      PLASMO_PUBLIC_PHOTOSWEEP_ALLOW_DEV_ENTITLEMENT: "0"
      PLASMO_PUBLIC_PHOTOSWEEP_ENTITLEMENT_PUBLIC_KEY: ci-public-key-placeholder

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          # Node 22 LTS: Node 24.16.0 hangs extracting the Playwright browser zip. See #123.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GPTK dependencies
        run: npm ci
        working-directory: Google-Photos-Toolkit

      - name: Build extension
        run: npm run build

      - name: Install Playwright + system deps
        run: npx playwright install chromium --with-deps

      - name: Full E2E tests
        env:
          CDP_URL: ${{ inputs.cdp_url }}
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
